<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#1a1a2e"/>
  
  <!-- Window frame -->
  <rect x="40" y="30" width="720" height="440" rx="10" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="40" rx="10" fill="#0f3460"/>
  <rect x="40" y="60" width="720" height="10" fill="#0f3460"/>
  
  <!-- Window buttons -->
  <circle cx="70" cy="50" r="7" fill="#ff5f56"/>
  <circle cx="95" cy="50" r="7" fill="#ffbd2e"/>
  <circle cx="120" cy="50" r="7" fill="#27c93f"/>
  
  <!-- Title text -->
  <text x="400" y="55" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="14" font-weight="bold">Linux GUI Command Helper</text>
  
  <!-- Sidebar -->
  <rect x="40" y="70" width="180" height="400" fill="#0a1628"/>
  
  <!-- Sidebar items -->
  <rect x="50" y="85" width="160" height="32" rx="5" fill="#1a3a5c"/>
  <text x="65" y="106" fill="#4fc3f7" font-family="monospace" font-size="12">⚡ System Commands</text>
  
  <rect x="50" y="125" width="160" height="32" rx="5" fill="#162d4a"/>
  <text x="65" y="146" fill="#81d4fa" font-family="monospace" font-size="12">📁 Folder Ops</text>
  
  <rect x="50" y="165" width="160" height="32" rx="5" fill="#162d4a"/>
  <text x="65" y="186" fill="#81d4fa" font-family="monospace" font-size="12">🔀 Git Repos</text>
  
  <rect x="50" y="205" width="160" height="32" rx="5" fill="#162d4a"/>
  <text x="65" y="226" fill="#81d4fa" font-family="monospace" font-size="12">📦 NPM Config</text>
  
  <rect x="50" y="245" width="160" height="32" rx="5" fill="#162d4a"/>
  <text x="65" y="266" fill="#81d4fa" font-family="monospace" font-size="12">🖥️ Terminal</text>
  
  <!-- Main content area -->
  <rect x="230" y="80" width="520" height="380" rx="6" fill="#0d1b2a"/>
  
  <!-- Terminal output area -->
  <rect x="245" y="90" width="490" height="200" rx="4" fill="#0a0e14" stroke="#1a3a5c" stroke-width="1"/>
  
  <!-- Terminal text lines -->
  <text x="260" y="115" fill="#27c93f" font-family="monospace" font-size="12">majid@linux:~$</text>
  <text x="385" y="115" fill="#e0e0e0" font-family="monospace" font-size="12">systemctl status docker</text>
  
  <text x="260" y="140" fill="#4fc3f7" font-family="monospace" font-size="11">● docker.service - Docker Application</text>
  <text x="260" y="160" fill="#81d4fa" font-family="monospace" font-size="11">   Loaded: loaded (/lib/systemd/system/docker.service)</text>
  <text x="260" y="180" fill="#27c93f" font-family="monospace" font-size="11">   Active: active (running) since Mon</text>
  
  <text x="260" y="210" fill="#27c93f" font-family="monospace" font-size="12">majid@linux:~$</text>
  <text x="385" y="210" fill="#e0e0e0" font-family="monospace" font-size="12">git status</text>
  
  <text x="260" y="235" fill="#ffbd2e" font-family="monospace" font-size="11">On branch main</text>
  <text x="260" y="255" fill="#81d4fa" font-family="monospace" font-size="11">Your branch is up to date with 'origin/main'</text>
  <text x="260" y="275" fill="#27c93f" font-family="monospace" font-size="11">nothing to commit, working tree clean</text>
  
  <!-- Action buttons area -->
  <rect x="245" y="305" width="150" height="40" rx="6" fill="#1565c0"/>
  <text x="320" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Run Command</text>
  
  <rect x="410" y="305" width="150" height="40" rx="6" fill="#2e7d32"/>
  <text x="485" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Git Pull All</text>
  
  <rect x="575" y="305" width="150" height="40" rx="6" fill="#e65100"/>
  <text x="650" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">NPM Install</text>
  
  <!-- Status bar -->
  <rect x="245" y="360" width="490" height="90" rx="4" fill="#0a1628" stroke="#1a3a5c" stroke-width="1"/>
  <text x="260" y="385" fill="#4fc3f7" font-family="monospace" font-size="11">Status: Ready</text>
  <text x="260" y="405" fill="#81d4fa" font-family="monospace" font-size="11">Active Repos: 12 | Packages: 48 | Uptime: 4h 23m</text>
  <text x="260" y="425" fill="#27c93f" font-family="monospace" font-size="11">✓ All systems operational</text>
  <text x="260" y="445" fill="#ffbd2e" font-family="monospace" font-size="11">⚡ Electron v28 | React v18 | Node v20</text>
  
  <!-- Linux penguin icon (simplified) -->
  <ellipse cx="690" cy="420" rx="20" ry="25" fill="#333333"/>
  <ellipse cx="690" cy="415" rx="14" ry="12" fill="#f5f5f5"/>
  <circle cx="685" cy="412" r="2.5" fill="#000"/>
  <circle cx="695" cy="412" r="2.5" fill="#000"/>
  <ellipse cx="690" cy="419" rx="4" ry="3" fill="#ff8f00"/>
  <ellipse cx="683" cy="440" rx="5" ry="3" fill="#ff8f00"/>
  <ellipse cx="697" cy="440" rx="5" ry="3" fill="#ff8f00"/>
</svg>
